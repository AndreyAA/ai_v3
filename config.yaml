# File Processor Service Configuration

# Directory settings
directories:
  # Base directory for file processing (folder A)
  watch_dir: "./watch"
  # Subdirectory for files being processed
  data_subdir: "data"
  # Subdirectory for processed files
  processed_subdir: "processed"

# Service settings
service:
  # Polling interval in seconds
  poll_interval_sec: 15

# Logging settings
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

# Chunking settings
chunking:
  # Maximum characters per chunk
  chunk_size: 1000
  # Overlap between adjacent chunks
  overlap: 100
